# Broker di sviluppo. Stessa forma di quello di casa — due listener, niente
# accesso anonimo — ma credenziali sue e nessuna persistenza: quello che c'e'
# dentro deve poter sparire senza che nessuno se ne accorga.
listener 1883

# Il configuratore web gira in un browser, e un browser non sa parlare MQTT su
# TCP: passa da qui.
listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/config/passwd

# Niente persistenza, al contrario di casa: un registro rimasto da ieri sarebbe
# uno stato che non hai messo tu, e le prove partirebbero da un posto diverso da
# quello che credi. Si riparte puliti a ogni `docker compose up`.
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
