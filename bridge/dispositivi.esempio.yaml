# Le sei prese trovate in rete il 12/09/2026 con l'ascolto degli annunci Tuya.
#
# Copia questo file in dispositivi.yaml e riempi le chiavi locali: senza quelle
# le prese ignorano qualunque comando. Vedi README, "Estrarre le chiavi locali".
#
# Il campo "ip" e' solo un suggerimento per il primo avvio: il ponte ascolta gli
# annunci in broadcast e segue il dispositivo se il DHCP lo sposta.
#
# Il "nome" finisce nei topic, quindi niente spazi ne' accenti: e' anche il nome
# con cui vedrai la presa nell'app, quindi conviene cambiarlo in qualcosa di
# vero (presa-lavatrice, presa-scrivania, ...) appena capisci quale e' quale.

mqtt:
  prefisso: casa
  qos: 1

tuya:
  intervallo_polling: 2          # secondi fra una lettura e la successiva
  timeout_socket: 4
  tentativi_prima_di_offline: 3
  # Uno solo: i tentativi che contano sono i tre del ciclo esterno, e qui si
  # moltiplicavano fra loro. Con tre ritrasmissioni una lettura a vuoto costa
  # 19,2 secondi misurati contro questa presa, con una sola 2,3 — ed e' il tempo
  # che l'app aspetta prima di sapere che qualcosa e' cambiato.
  tentativi_socket: 1            # ritrasmissioni sul singolo scambio
  validita_comando: 30           # dopo tanti secondi un comando non passato si abbandona
  soglia_lettura_lenta: 3        # oltre tanti secondi la lettura finisce nel log

  # L'energia si accumula qui e finisce in stato/energia.db, una riga per presa
  # e per ora. Nell'archivio va il conteggio grezzo e non i kWh: il fattore lo
  # trasforma in energia solo quando si legge, quindi tararlo fra sei mesi
  # aggiusta anche i sei mesi gia' passati.
  energia:
    # Da dove si conta. "potenza" integra il dp 19 misurato, "contatore" fa le
    # differenze del dp 17. Il dp 17 sembrava la scelta solida e non lo e': e'
    # l'energia accumulata dall'ultima raccolta del cloud Tuya, la presa lo
    # azzera quando il cloud la interroga, e in LAN lo rinfresca troppo di rado
    # perche' le nostre differenze lo seguano — ogni azzeramento si porta via un
    # ciclo intero. Misurato il 14/09/2026 contro l'app Tuya: mancava un fattore
    # 2,1. Il perche' per esteso sta nella docstring di Contatore, in bridge.py.
    sorgente: potenza
    dp_contatore: 17             # serve ancora ai fattori delle righe gia' in archivio
    wh_per_tacca: 1.0            # solo per "contatore": DA TARARE, misurato 0,4-0,8

  # Tutte e sette misurano i consumi e usano gli stessi dp. Valgono per ogni
  # dispositivo che non abbia un suo blocco "letture".
  letture_predefinite:
    corrente_ma: {dp: 18, scala: 1}
    potenza_w:   {dp: 19, scala: 10}
    tensione_v:  {dp: 20, scala: 10}

