name: smart-home

services:

  broker:
    image: eclipse-mosquitto:2
    container_name: sh-broker
    restart: unless-stopped
    # Da root mosquitto scende a uid 1883 e non leggerebbe piu' il file di
    # password, che appartiene all'utente host. Girando gia' come lui, legge.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "1883:1883"
      # MQTT su websocket, per il configuratore web. Fissa come il 1883 e non in
      # .env: e' una porta interna alla rete di casa, non una che si apre sul
      # router.
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3", "-u", "${MQTT_USER}", "-P", "${MQTT_PASS}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ponte:
    # Nessun `build:`: l'immagine arriva gia' pronta dalla macchina di sviluppo,
    # costruita per arm64 e taggata con lo SHA del commit. Vedi devops/deploy.sh.
    # Cosi' `docker image inspect` risponde a "quale revisione sta girando?", e il
    # Pi non ha bisogno dei sorgenti per tirare su un servizio.
    image: smart-home/tuya-mqtt:${IMAGE_TAG:?IMAGE_TAG non impostato: lo scrive devops/deploy.sh in .env}
    container_name: sh-ponte
    restart: unless-stopped
    # Come il broker: senza, i file dell'archivio nascerebbero di root dentro
    # la cartella del progetto. La scoperta usa UDP 6666/6667, porte alte:
    # nessun privilegio da perdere.
    user: "${PUID:-1000}:${PGID:-1000}"
    # Rete host: i Tuya si annunciano in broadcast UDP su 6666/6667 e un
    # container in bridge non li vedrebbe mai.
    network_mode: host
    environment:
      TZ: Europe/Rome
      MQTT_HOST: 127.0.0.1
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
      LIVELLO_LOG: ${LIVELLO_LOG:-INFO}
    volumes:
      - ./dispositivi.yaml:/app/dispositivi.yaml:ro
      - ./stato:/app/stato
    depends_on:
      broker:
        condition: service_healthy

  configuratore:
    image: smart-home/configuratore:${IMAGE_TAG:?IMAGE_TAG non impostato: lo scrive devops/deploy.sh in .env}
    container_name: sh-configuratore
    restart: unless-stopped
    # Niente depends_on sul broker: e' il browser a parlargli, non questo
    # container. A broker spento la pagina si apre e lo dice.
    ports:
      - "${CONFIGURATORE_PORT:-8080}:80"

  # Avvio opzionale:  docker compose --profile vpn up -d
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: sh-wireguard
    profiles: ["vpn"]
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Rome
      SERVERURL: ${WG_SERVERURL}
      SERVERPORT: ${WG_PORT:-51820}
      PEERS: ${WG_PEERS:-telefono}
      PEERDNS: "192.168.86.1"
      # Split tunnel: nel tunnel finisce solo la LAN di casa, non tutto il
      # traffico del telefono.
      ALLOWEDIPS: "192.168.86.0/24"
      INTERNAL_SUBNET: "10.13.13.0"
    ports:
      - "${WG_PORT:-51820}:51820/udp"
    volumes:
      - ./wireguard:/config
      - /lib/modules:/lib/modules:ro
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
