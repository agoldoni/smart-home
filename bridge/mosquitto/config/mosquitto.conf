# Broker di casa: nessun accesso anonimo, nemmeno in LAN.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
# Scommentare per vedere a quali topic si iscrive ogni client: e' l'unico modo
# di sapere da fuori cosa l'app sta davvero ascoltando, e distingue in un colpo
# solo "non riceve il messaggio" da "non lo ha mai chiesto". Una riga per
# sottoscrizione, nella forma  <client id> <qos> <topic>.
#log_type subscribe

# I messaggi ritenuti sono la ragione per cui l'app trova subito lo stato
# delle prese quando riapre: non vanno limitati.
max_queued_messages 1000
