server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Niente proxy verso il broker: il browser ci parla da se', in websocket
    # sulla 9001. Qui dentro ci sono solo file.
    location / {
        try_files $uri $uri/ =404;
        # Le pagine si ricaricano dopo un aggiornamento dell'immagine invece di
        # restare quelle di ieri. Sono pochi kilobyte: non c'e' niente da
        # risparmiare tenendoli in cache.
        add_header Cache-Control "no-cache";
    }

    # Il client MQTT e' l'unico file grosso e cambia solo quando si aggiorna la
    # libreria: quello si tiene.
    location /vendor/ {
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;
}
